spring.datasource.url=jdbc:sqlite:mon_projet.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# CONFIGURATION CRITIQUE POUR LES TESTS :
# 'update' cause souvent des erreurs de syntaxe sur SQLite lors des tests.
# Utilisez 'create' ou 'create-drop' pour que la base soit recréée proprement à chaque test.
spring.jpa.hibernate.ddl-auto=create

# Paramètres JPA recommandés pour SQLite
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Configuration serveur
server.port=8081